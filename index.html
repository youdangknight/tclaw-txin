<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCLaw 龙虾 · AI 工作台</title>
<style>
:root{
  --side-bg:#f6f7f9; --panel:#ffffff; --border:#e8e9ed; --line:#ededf0;
  --text:#1f2329; --sub:#8a9099; --sub2:#a6abb4;
  --ink:#202124; --chip:#f3f4f6;
  --blue:#2b6de8;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--panel);color:var(--text);font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;flex-direction:column;height:100vh;}
svg{display:block;}

/* ============ macOS 窗口栏 ============ */
.titlebar{
  height:38px;flex-shrink:0;display:flex;align-items:center;
  padding:0 14px;position:relative;background:#fff;
}
.traffic{display:flex;gap:8px;}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;}
.traffic i:nth-child(1){background:#ff5f57;}
.traffic i:nth-child(2){background:#febc2e;}
.traffic i:nth-child(3){background:#28c840;}
.tb-tools{display:flex;align-items:center;gap:6px;margin-left:32px;}
.tb-icon{width:30px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#6b7078;cursor:pointer;}
.tb-icon:hover{background:#f1f2f4;color:var(--text);}
.tb-right{position:absolute;right:14px;top:0;height:38px;display:flex;align-items:center;}

/* ============ 主体 ============ */
.body{flex:1;display:flex;min-height:0;}

/* ============ 左侧融合栏 ============ */
.side{
  width:296px;flex-shrink:0;background:var(--side-bg);
  display:flex;flex-direction:column;min-height:0;
}
.nav{padding:10px 12px 6px;flex-shrink:0;}
.nav-item{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;
  border-radius:9px;color:#3a3f47;font-size:14px;cursor:pointer;
  font-weight:400;white-space:nowrap;
}
.nav-item .ic{color:#5b616a;display:flex;flex-shrink:0;}
.nav-item:hover{background:#eceef1;}
.nav-item.new{font-weight:500;color:#1f2329;}

/* IM 会话区：图标轨 + 会话列表 */
.im{flex:1;display:flex;min-height:0;border-top:1px solid var(--line);}
.rail{
  width:54px;flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;padding:10px 0;gap:4px;
}
.rail .r-icon{
  width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:#5b616a;cursor:pointer;
}
.rail .r-icon:hover{background:#eceef1;color:var(--text);}
.rail .r-sp{flex:1;}

.conv{flex:1;display:flex;flex-direction:column;min-width:0;}
.tabs{
  height:46px;flex-shrink:0;display:flex;align-items:center;gap:14px;
  padding:0 10px 0 2px;font-size:12.5px;color:var(--sub);white-space:nowrap;
}
.tabs .t{cursor:pointer;height:100%;display:flex;align-items:center;}
.tabs .t.on{color:var(--text);font-weight:600;}
.tabs .t:hover{color:var(--text);}
.tabs .add{
  width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--sub);cursor:pointer;flex-shrink:0;
}
.tabs .add:hover{background:#eceef1;color:var(--text);}
.conv-list{flex:1;overflow-y:auto;padding:0 6px 6px;}
.conv-item{
  display:flex;align-items:center;gap:9px;padding:8px 8px;border-radius:10px;cursor:pointer;
}
.conv-item:hover{background:#eceef1;}
.conv-item .face{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;
  background:#e3e6ea;
}
.conv-item .meta{flex:1;min-width:0;}
.conv-item .row1{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.conv-item .nm{font-size:13.5px;font-weight:500;color:var(--text);}
.conv-item .time{font-size:11.5px;color:var(--sub2);flex-shrink:0;}
.conv-item .preview{
  font-size:12px;color:var(--sub);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 底部当前用户 */
.userbar{
  height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 12px;border-top:1px solid var(--line);
}
.userbar .u-face{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#2b6de8,#4d8dff);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  position:relative;
}
.userbar .u-face::after{
  content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
  background:#28c840;border:2px solid var(--side-bg);
}
.userbar .u-name{font-size:13.5px;font-weight:500;}
.userbar .u-more{margin-left:auto;color:#8a9099;cursor:pointer;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.userbar .u-more:hover{background:#eceef1;color:var(--text);}

/* ============ 主区 ============ */
.main{flex:1;position:relative;overflow-y:auto;background:#fff;}
.refresh{
  position:absolute;top:8px;right:16px;width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#9aa0a8;cursor:pointer;z-index:2;
}
.refresh:hover{background:#f2f3f5;color:var(--text);}
.home{
  max-width:860px;margin:0 auto;padding:9vh 24px 60px;
  display:flex;flex-direction:column;align-items:center;
}
.home h1{font-size:23px;font-weight:600;letter-spacing:.2px;}

/* 场景切换 */
.scenes{
  margin-top:22px;display:flex;background:var(--chip);border-radius:20px;padding:3px;gap:2px;
}
.scene{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 16px;border-radius:17px;
  font-size:13.5px;color:#5b616a;cursor:pointer;white-space:nowrap;
}
.scene .sic{display:flex;}
.scene.on{background:#1f2329;color:#fff;font-weight:500;}
.scene:not(.on):hover{color:var(--text);}

/* 输入卡 */
.composer{
  width:100%;margin-top:26px;border:1px solid var(--border);border-radius:18px;
  background:#fff;box-shadow:0 2px 14px rgba(31,35,41,.04);overflow:hidden;
}
.composer textarea{
  width:100%;border:none;outline:none;resize:none;display:block;
  padding:17px 18px 4px;font-size:14.5px;line-height:1.6;
  font-family:inherit;color:var(--text);background:transparent;height:62px;
}
.composer textarea::placeholder{color:#b4b9c1;}
.composer .tools{
  display:flex;align-items:center;gap:4px;padding:4px 12px 12px;
}
.tool{
  display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;
  border-radius:9px;font-size:12.5px;color:#5b616a;cursor:pointer;white-space:nowrap;
}
.tool .tic{display:flex;color:#6b7078;}
.tool:hover{background:#f2f3f5;color:var(--text);}
.voice{margin-left:auto;}
.send{
  border:1px solid var(--border);background:#fff;color:#1f2329;font-weight:500;
}
.send .tic{color:#1f2329;}
.send:hover{background:#1f2329;color:#fff;}
.send:hover .tic{color:#fff;}
.project-row{
  height:40px;background:#f6f7f9;display:flex;align-items:center;gap:7px;
  padding:0 16px;font-size:12.5px;color:#6b7078;cursor:pointer;border-top:1px solid #f0f1f3;
}
.project-row .chev{margin-left:2px;color:#9aa0a8;}
.project-row:hover{background:#f1f2f4;}

/* 快捷指令 */
.quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center;}
.qchip{
  display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  border:1px solid var(--border);border-radius:10px;background:#fff;
  font-size:13px;color:#3a3f47;cursor:pointer;white-space:nowrap;
}
.qchip .qic{display:flex;color:#6b7078;}
.qchip:hover{border-color:#cfd3d9;background:#fafbfc;}
.qchip:hover .qic{color:var(--text);}

/* 高阶教程 */
.tut-head{
  width:100%;display:flex;align-items:center;gap:8px;margin-top:38px;margin-bottom:14px;
}
.tut-head .bar{width:4px;height:16px;border-radius:2px;background:var(--blue);}
.tut-head h3{font-size:15px;font-weight:600;}
.tut-head .more{margin-left:auto;font-size:12.5px;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:2px;}
.tut-head .more:hover{color:var(--blue);}
.tut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;}
.tcard{
  background:#f5f6f8;border-radius:14px;padding:15px 15px 0;height:118px;cursor:pointer;
  position:relative;overflow:hidden;transition:.15s;
}
.tcard:hover{background:#eff0f3;}
.tcard .tt{
  font-size:12.5px;line-height:1.7;color:#3a3f47;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  max-width:82%;
}
.tcard .deco{
  position:absolute;right:10px;bottom:0;width:88px;height:52px;
  background:linear-gradient(180deg,rgba(255,255,255,.9),#fff);
  border-radius:10px 10px 0 0;
}
.tcard .deco::before,.tcard .deco::after{
  content:"";position:absolute;left:12px;right:12px;height:7px;border-radius:4px;background:#eceef1;
}
.tcard .deco::before{top:12px;}
.tcard .deco::after{top:26px;left:12px;width:55%;}

/* 吉祥物 */
.mascot{
  position:absolute;right:20px;bottom:10px;width:104px;height:auto;cursor:pointer;z-index:3;
  mix-blend-mode:multiply;
  filter:drop-shadow(0 8px 14px rgba(224,67,47,.16));transition:transform .2s;
}
.mascot:hover{transform:translateY(-3px);}

/* toast */
.toast{
  position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
  background:rgba(31,35,41,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 滚动条 */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#c2c6cc;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div class="app">

  <!-- macOS 窗口栏 -->
  <div class="titlebar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="tb-tools">
      <div class="tb-icon" title="搜索" onclick="toast('搜索（原型演示）')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </div>
      <div class="tb-icon" title="侧边栏" onclick="toast('切换侧边栏（原型演示）')">

      </div>
    </div>

  </div>

  <div class="body">

    <!-- 左侧融合栏 -->
    <aside class="side">
      <nav class="nav">
        <div class="nav-item new" onclick="toast('新建任务（原型演示）')">

        </div>
        <div class="nav-item" onclick="toast('定时任务（原型演示）')">
          <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.6 2M9 2h6M12 5V2"/></svg></span>
          定时任务
        </div>
        <a class="nav-item" href="projects.html" style="text-decoration:none">
          <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8.2 7.3 15.8 10.7M8.2 16.7l7.6-3.4"/></svg></span>
          项目
        </a>
        <a class="nav-item" href="employees.html" style="text-decoration:none">
          <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.7 9.3 19.5 11 13.7 12.7 12 18.5 10.3 12.7 4.5 11 10.3 9.3Z"/><path d="M18.5 16.5 19 18l1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5Z" stroke-width="1.3"/></svg></span>
          硅基员工·技能·连接器
        </a>
        <div class="nav-item" onclick="toast('AI 资产库（原型演示）')">
          <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.2-1.4 4.4-2 8-2s5.8.6 8 2v13c-2.2-1.4-4.4-2-8-2s-5.8.6-8 2Z"/><path d="M12 3.5v13"/></svg></span>
          AI资产库
        </div>
        <div class="nav-item" onclick="toast('更多（原型演示）')">
          <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span>
          更多
        </div>
      </nav>

      <!-- IM 会话 -->
      <div class="im">
        <div class="rail">
          <div class="r-icon" title="任务" onclick="toast('任务（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5 3 7l5 5-5 5 2 2 7-7Z"/><path d="m12 5 7 7-7 7" /></svg>
          </div>
          <div class="r-icon" title="图片" onclick="toast('图片（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.7"/><path d="m4.5 17.5 5-5 3.5 3.5 2.5-2.5 4 4"/></svg>
          </div>
          <div class="r-icon" title="工作" onclick="toast('工作（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M8.5 7.5V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1.5M3.5 12.5h17"/></svg>
          </div>
          <div class="r-icon" title="视频会议" onclick="toast('视频会议（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-2.5v9L16 14"/></svg>
          </div>
          <div class="r-icon" title="收藏" onclick="toast('收藏（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 4h10v16l-5-3.2L7 20Z"/></svg>
          </div>
          <div class="r-icon" title="应用" onclick="toast('应用（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="7.5" r="2.2"/><circle cx="7.5" cy="16.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/></svg>
          </div>
          <div class="r-icon" title="云文档" onclick="toast('云文档（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M7 18a4 4 0 1 1 .7-7.9A5.5 5.5 0 0 1 18.3 12 3.5 3.5 0 0 1 17.5 18Z"/></svg>
          </div>
          <div class="r-sp"></div>
          <div class="r-icon" title="更多" onclick="toast('更多（原型演示）')">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>
          </div>
        </div>

        <div class="conv">
          <div class="tabs">
            <span class="t on">全部对话</span>
            <span class="t">未读99+</span>
            <span class="t">待处理</span>
            <span class="t">@我</span>
            <span class="add" title="新建" onclick="toast('新建会话（原型演示）')">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>

      <!-- 当前用户 -->
      <div class="userbar">
        <div class="u-face">哈</div>

        <div class="u-more" title="菜单" onclick="toast('账号菜单（原型演示）')">

        </div>
      </div>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <div class="refresh" title="刷新" onclick="location.reload()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-5.3L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 5.3L20 16"/><path d="M20 20v-4h-4"/></svg>
      </div>

      <div class="home">
        <h1>嗨，我是TCLaw龙虾，你的专属AI同事。</h1>

        <div class="scenes" id="scenes">
          <div class="scene on">
            <span class="sic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9h8M8 13h5"/></svg></span>
            日常办公
          </div>
          <div class="scene">
            <span class="sic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="5.5" y="7.5" width="13" height="12" rx="2.5"/><path d="M12 7.5V4.5M9.5 4.5h5"/><circle cx="9.8" cy="12.5" r="1" fill="currentColor"/><circle cx="14.2" cy="12.5" r="1" fill="currentColor"/></svg></span>
            硅基员工
          </div>
          <div class="scene">
            <span class="sic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8.5 8.5-3.5 3.5 3.5 3.5M15.5 8.5l3.5 3.5-3.5 3.5M13 5.5l-2 13"/></svg></span>
            代码开发
          </div>
        </div>

        <div class="composer">
          <textarea id="ta" placeholder="今天我能为你做些什么？"></textarea>
          <div class="tools">
            <div class="tool" onclick="toast('添加附件（原型演示）')">
              <span class="tic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5 12.5 19a5 5 0 0 1-7-7l7.5-7.5a3.3 3.3 0 0 1 4.7 4.7L10.2 16.7a1.6 1.6 0 0 1-2.3-2.3l6.8-6.8"/></svg></span>

<script>
// 会话列表
const CONVS = Array.from({length:7}, () => ({
  name:'梁梦欣', time:'12:00', text:'[5条]发给你了噢~'
}));
document.getElementById('convList').innerHTML = CONVS.map(c => `
  <div class="conv-item" onclick="toast('打开与${c.name}的会话（原型演示）')">
    <img class="face" src="assets/avatar.png" alt="${c.name}">
    <div class="meta">
      <div class="row1"><span class="nm">${c.name}</span><span class="time">${c.time}</span></div>
      <div class="preview">${c.text}</div>
    </div>
  </div>`).join('');

// 场景切换
document.querySelectorAll('#scenes .scene').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('#scenes .scene').forEach(s => s.classList.remove('on'));
    el.classList.add('on');
  };
});

// 快捷指令
function fillInput(t){
  const ta = document.getElementById('ta');
  ta.value = t;
  ta.focus();
}
function send(){
  const ta = document.getElementById('ta');
  if(!ta.value.trim()){ toast('请输入内容（原型演示）'); return; }
  toast('已发送：' + ta.value.trim());
  ta.value = '';
}

// toast
let toastTimer;
function toast(msg){
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
</script>
