<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目 · TCLaw 龙虾 AI 工作台</title>
<style>
:root{
  --side-bg:#f6f7f9; --panel:#ffffff; --border:#e8e9ed; --line:#ededf0;
  --text:#1f2329; --sub:#8a9099; --sub2:#a6abb4; --chip:#f3f4f6;
  --blue:#2f7bf6; --blue-d:#2568dd; --ink:#1f2329;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#fff;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
.app{display:flex;flex-direction:column;height:100vh;}
svg{display:block;}

/* 窗口栏 */
.titlebar{height:38px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;}
.traffic{display:flex;gap:8px;}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;}
.traffic i:nth-child(1){background:#ff5f57;}.traffic i:nth-child(2){background:#febc2e;}.traffic i:nth-child(3){background:#28c840;}
.tb-tools{display:flex;align-items:center;gap:6px;margin-left:32px;}
.tb-icon{width:30px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#6b7078;cursor:pointer;}
.tb-icon:hover{background:#f1f2f4;color:var(--text);}

.body{flex:1;display:flex;min-height:0;}

/* 左侧融合栏（与主页一致） */
.side{width:296px;flex-shrink:0;background:var(--side-bg);display:flex;flex-direction:column;min-height:0;}
.nav{padding:10px 12px 6px;flex-shrink:0;}
.nav-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;color:#3a3f47;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;}
.nav-item .ic{color:#5b616a;display:flex;flex-shrink:0;}
.nav-item:hover{background:#eceef1;}
.nav-item.new{font-weight:500;color:#1f2329;}
.nav-item.on{background:#e8effc;color:var(--blue);font-weight:500;}
.nav-item.on .ic{color:var(--blue);}
.im{flex:1;display:flex;min-height:0;border-top:1px solid var(--line);}
.rail{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;}
.rail .r-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#5b616a;cursor:pointer;}
.rail .r-icon:hover{background:#eceef1;color:var(--text);}
.rail .r-sp{flex:1;}
.conv{flex:1;display:flex;flex-direction:column;min-width:0;}
.tabs{height:46px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 10px 0 2px;font-size:12.5px;color:var(--sub);white-space:nowrap;}
.tabs .t{cursor:pointer;}
.tabs .t.on{color:var(--text);font-weight:600;}
.conv-list{flex:1;overflow-y:auto;padding:0 6px 6px;}
.conv-item{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;}
.conv-item:hover{background:#eceef1;}
.conv-item .face{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;}
.conv-item .meta{flex:1;min-width:0;}
.conv-item .row1{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.conv-item .nm{font-size:13.5px;font-weight:500;}
.conv-item .time{font-size:11.5px;color:var(--sub2);}
.conv-item .preview{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.userbar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--line);}
.userbar .u-face{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#2b6de8,#4d8dff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;}
.userbar .u-face::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#28c840;border:2px solid var(--side-bg);}
.userbar .u-name{font-size:13.5px;font-weight:500;}
.userbar .u-more{margin-left:auto;color:#8a9099;cursor:pointer;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.userbar .u-more:hover{background:#eceef1;}

/* ============ 主区 ============ */
.main{flex:1;overflow-y:auto;background:#fff;}
.wrap{max-width:1080px;margin:0 auto;padding:26px 36px 60px;}

/* Hero */
.hero{display:flex;align-items:center;gap:24px;background:linear-gradient(100deg,#f2f6ff 0%,#f6f4ff 55%,#f3f8ff 100%);border:1px solid #edf1fa;border-radius:20px;padding:30px 34px;position:relative;overflow:hidden;}
.hero .h-left{flex:1;min-width:0;z-index:1;}
.hero h1{font-size:27px;font-weight:700;letter-spacing:.3px;}
.hero p{font-size:13.5px;color:#7a8290;margin-top:9px;}
.btn-new{margin-top:20px;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;cursor:pointer;border:none;}
.btn-new:hover{background:#000;}
.hero .h-pic{width:330px;height:150px;flex-shrink:0;border-radius:14px;object-fit:cover;opacity:.96;}

/* 区块标题行 */
.sec-head{display:flex;align-items:center;margin:30px 2px 14px;gap:12px;}
.sec-head h2{font-size:16.5px;font-weight:700;}
.sec-head .sp{flex:1;}
.search{display:flex;align-items:center;gap:7px;width:260px;height:36px;border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--sub2);}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;color:var(--text);background:transparent;}
.search input::placeholder{color:#b4b9c1;}

/* 我的项目 */
.my-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.pcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 16px 14px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px;}
.pcard:hover{box-shadow:0 6px 20px rgba(31,35,41,.07);border-color:#dde1e8;transform:translateY(-1px);}
.pcard .p-ic{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.pcard .p-meta{flex:1;min-width:0;}
.pcard .p-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .p-sub{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .p-more{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#b3bac7;flex-shrink:0;}
.pcard .p-more:hover{background:#f2f3f5;color:var(--text);}
.pcard.archived{opacity:.72;}
.tag-arch{font-size:10.5px;color:var(--sub);background:#f2f3f5;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px;}

/* 模板 */
.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.tpl{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:13px;transition:.15s;}
.tpl:hover{box-shadow:0 6px 20px rgba(31,35,41,.07);border-color:#cfd9ee;background:#fbfcff;}
.tpl .t-ic{width:42px;height:42px;border-radius:11px;flex-shrink:0;background:#eef2f8;color:#5b6b85;display:flex;align-items:center;justify-content:center;}
.tpl .t-meta{flex:1;min-width:0;}
.tpl .t-name{font-size:14px;font-weight:600;}
.tpl .t-desc{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tpl .t-go{color:#c2c7cf;flex-shrink:0;display:flex;}
.tpl:hover .t-go{color:var(--blue);}

.empty-hint{grid-column:1/-1;text-align:center;color:var(--sub2);font-size:13px;padding:34px 0;display:none;}

/* 新建项目弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:50;}
.mask.show{display:flex;}
.modal{width:480px;max-width:92vw;background:#fff;border-radius:18px;padding:26px 26px 22px;box-shadow:0 24px 60px rgba(15,23,42,.25);}
.modal h3{font-size:18px;font-weight:700;}
.modal .m-sub{font-size:12.5px;color:var(--sub);margin-top:5px;}
.fld{margin-top:18px;}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:7px;}
.fld input[type=text],.fld textarea,.fld select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;color:var(--text);background:#fff;}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue);}
.fld textarea{resize:none;height:68px;}
.tpl-pick{display:flex;flex-wrap:wrap;gap:8px;}
.tpl-chip{font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;color:#5b616a;background:#fff;}
.tpl-chip.on{border-color:var(--blue);background:#f0f6ff;color:var(--blue);font-weight:500;}
.m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.btn{height:38px;padding:0 20px;border-radius:10px;font-size:13.5px;cursor:pointer;border:1px solid var(--border);background:#fff;color:#3a3f47;font-family:inherit;}
.btn:hover{background:#f5f6f8;}
.btn-pri{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-pri:hover{background:#000;}

/* toast */
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:rgba(31,35,41,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:3px;}
</style>
</head>

<script>
// 配色（粉彩图标）
const COLORS=[['#eef2ff','#4a5fbf'],['#e6f7ee','#18a058'],['#fff4e5','#e8932b'],['#fdeef4','#d6487e'],['#e4f4f6','#1596a8'],['#f1ecfb','#6a5be2']];

let PROJECTS=[
  {id:'guide',name:'项目新手指引',sub:'添加于 1 个月前',t:'指',archived:false,tpl:''},
  {id:'q3',name:'2026 Q3 产品规划',sub:'3 个对话 · 4 个文件 · 更新于 09/03',t:'Q',archived:false,tpl:''},
  {id:'lobster',name:'龙虾 Projects 模块',sub:'12 个对话 · 8 个文件 · 3 个定时任务',t:'龙',archived:false,tpl:''},
  {id:'comp',name:'Q3 竞品分析专项',sub:'5 个对话 · 2 个文档',t:'竞',archived:false,tpl:''},
  {id:'conf',name:'开发者大会支持',sub:'9 个对话 · 已归档',t:'会',archived:true,tpl:''},
  {id:'mini',name:'X11H Mini LED 上市…',sub:'7 个对话 · 11 个文件',t:'X',archived:false,tpl:''}
];
const TEMPLATES=[
  {id:'t1',name:'产品需求全流程',desc:'从需求规划、PRD 到研发测试验收'},
  {id:'t2',name:'市场调研与竞品分析',desc:'深度调研、竞品拆解、报告评审'},
  {id:'t3',name:'团队知识库',desc:'持续沉淀 SOP、经验和 FAQ'},
  {id:'t4',name:'项目交付',desc:'管理客户需求、计划、风险和周报'},
  {id:'t5',name:'Bug 跟踪/测试验收',desc:'持续跟踪 Bug，统一测试用例和验收结论'}
];

function colorOf(name){ let h=0; name.split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0); return COLORS[h%COLORS.length]; }

function renderMine(){
  const kw=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  const list=PROJECTS.filter(p=>p.name.toLowerCase().includes(kw));
  document.getElementById('myCount').textContent='共 '+PROJECTS.length+' 个';
  const grid=document.getElementById('myGrid');
  grid.innerHTML = list.length ? list.map((p,i)=>{
    const [bg,c]=colorOf(p.name);
    return `<div class="pcard ${p.archived?'archived':''}" onclick="openProject('${p.id}','${p.name.replace(/'/g,"\\'")}')">
      <div class="p-ic" style="background:${bg};color:${c}">${p.t}</div>
      <div class="p-meta">
        <div class="p-name">${p.name}${p.archived?'<span class="tag-arch">已归档</span>':''}</div>
        <div class="p-sub">${p.sub}</div>
      </div>
      <div class="p-more" onclick="event.stopPropagation();toast('项目更多操作（原型演示）')"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></div>
    </div>`;
  }).join('') : '<div class="empty-hint" style="display:block">没有匹配的项目</div>';
}
function renderTpl(){
  document.getElementById('tplGrid').innerHTML=TEMPLATES.map(t=>`
    <div class="tpl" onclick="openCreate('${t.id}')">
      <div class="t-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"/><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="12" r="2.2"/><path d="M8 7.2 15.8 10.8M8 16.8l7.8-3.6"/></svg></div>
      <div class="t-meta"><div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div></div>
      <span class="t-go"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
    </div>`).join('');
}

// 新建弹窗
let pickedTpl='';
function openCreate(tplId){
  pickedTpl=tplId||'';
  document.getElementById('fName').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('tplPick').innerHTML =
    '<div class="tpl-chip '+(pickedTpl===''?'on':'')+'" data-id="">空白项目</div>'+
    TEMPLATES.map(t=>`<div class="tpl-chip ${pickedTpl===t.id?'on':''}" data-id="${t.id}">${t.name}</div>`).join('');
  document.querySelectorAll('#tplPick .tpl-chip').forEach(el=>el.onclick=()=>{
    pickedTpl=el.dataset.id;
    document.querySelectorAll('#tplPick .tpl-chip').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
  });
  document.getElementById('mask').classList.add('show');
  setTimeout(()=>document.getElementById('fName').focus(),50);
}
function closeCreate(){ document.getElementById('mask').classList.remove('show'); }
function createProject(){
  const name=document.getElementById('fName').value.trim();
  if(!name){ toast('请输入项目名称'); document.getElementById('fName').focus(); return; }
  const desc=document.getElementById('fDesc').value.trim();
  const tpl=TEMPLATES.find(t=>t.id===pickedTpl);
  PROJECTS.unshift({id:'p'+Date.now(),name,sub:(tpl?'来自模板「'+tpl.name+'」 · ':'刚刚创建')+(desc?'':' '),t:name[0],archived:false,tpl:pickedTpl});
  closeCreate();
  renderMine();
  toast('项目「'+name+'」已创建');
}
function openProject(id,name){ location.href='project-detail.html?id='+encodeURIComponent(id)+'&name='+encodeURIComponent(name); }

// 会话列表
document.getElementById('convList').innerHTML=Array.from({length:6},()=>`
  <div class="conv-item" onclick="toast('打开会话（原型演示）')">
    <img class="face" src="assets/avatar.png">
    <div class="meta"><div class="row1"><span class="nm">梁梦欣</span><span class="time">12:00</span></div><div class="preview">[5条]发给你了噢~</div></div>
  </div>`).join('');

let toastTimer;
function toast(msg){const el=document.getElementById('toastEl');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCreate();});
renderMine();renderTpl();
</script>
