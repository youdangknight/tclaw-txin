<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目 · TCLaw 龙虾 AI 工作台</title>
<style>
:root{
  --side-bg:#f6f7f9; --panel:#ffffff; --border:#e8e9ed; --line:#ededf0;
  --text:#1f2329; --sub:#8a9099; --sub2:#a6abb4; --chip:#f3f4f6;
  --blue:#2f7bf6; --blue-d:#2568dd; --ink:#1f2329;
  --purple:#6a5be2;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#fff;color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}
.app{display:flex;flex-direction:column;height:100vh;}
svg{display:block;}

/* 窗口栏 */
.titlebar{height:38px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;}
.traffic{display:flex;gap:8px;}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;}
.traffic i:nth-child(1){background:#ff5f57;}.traffic i:nth-child(2){background:#febc2e;}.traffic i:nth-child(3){background:#28c840;}
.tb-tools{display:flex;align-items:center;gap:6px;margin-left:32px;}
.tb-icon{width:30px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#6b7078;cursor:pointer;text-decoration:none;}
.tb-icon:hover{background:#f1f2f4;color:var(--text);}

.body{flex:1;display:flex;min-height:0;}

/* 左侧融合栏（与主页一致） */
.side{width:296px;flex-shrink:0;background:var(--side-bg);display:flex;flex-direction:column;min-height:0;}
.nav{padding:10px 12px 6px;flex-shrink:0;}
.nav-item{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:9px;color:#3a3f47;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;}
.nav-item .ic{color:#5b616a;display:flex;flex-shrink:0;}
.nav-item:hover{background:#eceef1;}
.nav-item.new{font-weight:500;color:#1f2329;}
.nav-item.on{background:#e8effc;color:var(--blue);font-weight:500;}
.nav-item.on .ic{color:var(--blue);}
.im{flex:1;display:flex;min-height:0;border-top:1px solid var(--line);}
.rail{width:54px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;}
.rail .r-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#5b616a;cursor:pointer;}
.rail .r-icon:hover{background:#eceef1;color:var(--text);}
.rail .r-sp{flex:1;}
.conv{flex:1;display:flex;flex-direction:column;min-width:0;}
.tabs{height:46px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 10px 0 2px;font-size:12.5px;color:var(--sub);white-space:nowrap;}
.tabs .t{cursor:pointer;}
.tabs .t.on{color:var(--text);font-weight:600;}
.conv-list{flex:1;overflow-y:auto;padding:0 6px 6px;}
.conv-item{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;}
.conv-item:hover{background:#eceef1;}
.conv-item .face{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover;}
.conv-item .meta{flex:1;min-width:0;}
.conv-item .row1{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.conv-item .nm{font-size:13.5px;font-weight:500;}
.conv-item .time{font-size:11.5px;color:var(--sub2);}
.conv-item .preview{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.userbar{height:58px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;border-top:1px solid var(--line);}
.userbar .u-face{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,#2b6de8,#4d8dff);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:relative;}
.userbar .u-face::after{content:"";position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#28c840;border:2px solid var(--side-bg);}
.userbar .u-name{font-size:13.5px;font-weight:500;}
.userbar .u-more{margin-left:auto;color:#8a9099;cursor:pointer;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.userbar .u-more:hover{background:#eceef1;}

/* ============ 主区 ============ */
.main{flex:1;overflow-y:auto;background:#fff;}
.wrap{max-width:1080px;margin:0 auto;padding:22px 36px 60px;}

/* 一级 Tab：项目 / 待办 */
.top-tabs{display:flex;align-items:center;gap:4px;}
.top-tabs .tt{height:34px;padding:0 16px;display:flex;align-items:center;border-radius:9px;font-size:14.5px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;}
.top-tabs .tt .tt-n{font-size:11.5px;font-weight:500;color:#b4b9c1;margin-left:5px;}
.top-tabs .tt.on{background:var(--ink);color:#fff;}
.top-tabs .tt.on .tt-n{color:rgba(255,255,255,.7);}

/* 页头：搜索 + 创建 */
.page-head{display:flex;align-items:center;gap:14px;margin-top:18px;}
.page-head .sp{flex:1;}
.search{display:flex;align-items:center;gap:7px;width:262px;height:38px;border:1px solid var(--border);border-radius:10px;padding:0 12px;color:var(--sub2);background:#fff;}
.search:focus-within{border-color:#bcd2fb;box-shadow:0 0 0 3px rgba(47,123,246,.10);}
.search input{border:none;outline:none;flex:1;font-size:13px;font-family:inherit;color:var(--text);background:transparent;}
.search input::placeholder{color:#b4b9c1;}

/* 创建按钮组 */
.btn-new{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 18px;border-radius:10px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;cursor:pointer;border:none;font-family:inherit;position:relative;}
.btn-new:hover{background:#000;}
.btn-new .caret{font-size:10px;opacity:.7;}
.create-menu{position:absolute;top:44px;right:0;z-index:60;width:200px;background:#fff;border-radius:12px;box-shadow:0 10px 32px rgba(15,23,42,.16);border:1px solid #f0f1f4;padding:6px;display:none;}
.create-menu.show{display:block;}
.create-menu .cm-i{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:8px;cursor:pointer;}
.create-menu .cm-i:hover{background:#f4f6f9;}
.create-menu .cm-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.create-menu .cm-ic.simple{background:#e8effc;color:var(--blue);}
.create-menu .cm-ic.enterprise{background:#f0ecfa;color:var(--purple);}
.create-menu .cm-t{font-size:13.5px;font-weight:600;}
.create-menu .cm-d{font-size:11.5px;color:var(--sub);margin-top:2px;}

/* Banner */
.banner{margin-top:18px;border-radius:16px;padding:26px 32px;position:relative;overflow:hidden;
  background:linear-gradient(105deg,#eef1ff 0%,#f4f1ff 48%,#eef4ff 100%);
  border:1px solid #e8ecfb;min-height:132px;display:flex;align-items:center;}
.banner .b-in{position:relative;z-index:2;}
.banner .b-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--purple);text-transform:uppercase;}
.banner h2{font-size:25px;font-weight:800;letter-spacing:.3px;margin-top:10px;color:#1f2329;}
.banner h2 .hl{color:var(--purple);}
.banner p{font-size:12.5px;color:#8b91a3;margin-top:9px;}
.banner .b-deco{position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:1;opacity:.95;}

/* 项目网格 */
.my-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px;}
.pcard{position:relative;background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;min-height:86px;}
.pcard:hover{box-shadow:0 8px 22px rgba(31,35,41,.08);border-color:#d9dee7;transform:translateY(-1px);}
.pcard .p-row{display:flex;align-items:center;gap:10px;}
.pcard .p-ic{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:#f2f4f7;color:#9aa1ad;display:flex;align-items:center;justify-content:center;}
.pcard .p-ic.enterprise{background:#f0ecfa;color:var(--purple);}
.pcard .p-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.pcard .p-more{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#b9bfc9;flex-shrink:0;}
.pcard .p-more:hover{background:#f2f3f5;color:var(--text);}
.pcard .p-time{font-size:11.5px;color:var(--sub2);margin:10px 0 0 44px;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.p-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 6px;}
.p-badge.simple{background:#e8effc;color:var(--blue);}
.p-badge.enterprise{background:#f0ecfa;color:var(--purple);}

/* 待办列表 */
.todo-pane{display:none;margin-top:18px;}
.todo-pane.on{display:block;}
.todo-stats{display:flex;gap:12px;margin-bottom:16px;}
.todo-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 18px;flex:1;}
.todo-stat .ts-n{font-size:22px;font-weight:800;}
.todo-stat .ts-l{font-size:12px;color:var(--sub);margin-top:2px;}
.todo-stat .ts-n.done{color:#18a058;}
.todo-stat .ts-n.pending{color:var(--blue);}
.todo-stat .ts-n.over{color:#f0524a;}
.todo-list{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.todo-group-h{padding:12px 16px;font-size:12.5px;font-weight:700;color:var(--sub);background:#fafbfc;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;}
.todo-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f3f5;}
.todo-item:last-child{border-bottom:none;}
.todo-item:hover{background:#fafbfc;}
.todo-ck{width:18px;height:18px;border-radius:5px;border:2px solid #d4d8df;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
.todo-ck.done{background:var(--blue);border-color:var(--blue);color:#fff;}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--sub2);}
.todo-body{flex:1;min-width:0;}
.todo-text{font-size:13.5px;color:var(--text);}
.todo-meta{font-size:11.5px;color:var(--sub2);margin-top:3px;display:flex;align-items:center;gap:8px;}
.todo-meta .tm-proj{color:var(--blue);}
.todo-meta .tm-dl.over{color:#f0524a;}
.todo-assignee{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);flex-shrink:0;}
.todo-assignee .a-av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;}
.todo-assignee .a-av.ai{background:linear-gradient(135deg,#2b6de8,#4d8dff);}
.todo-assignee .a-av.bot{background:linear-gradient(135deg,#6a5be2,#8b7af0);}

/* 创建项目卡 */
.pcard-create{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:#f3f4f6;border:1px solid #eceef1;border-radius:14px;cursor:pointer;min-height:86px;
  color:#6b7078;font-size:14px;font-weight:500;transition:.15s;}
.pcard-create:hover{background:#eceef1;color:var(--text);}
.pcard-create .plus{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#8a9099;}

/* 卡片下拉菜单 */
.menu{position:fixed;z-index:60;width:148px;background:#fff;border-radius:12px;box-shadow:0 10px 32px rgba(15,23,42,.16);border:1px solid #f0f1f4;padding:6px;display:none;}
.menu.show{display:block;}
.menu .mi{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;border-radius:8px;font-size:13.5px;color:#3a3f47;cursor:pointer;}
.menu .mi:hover{background:#f4f6f9;}
.menu .mi.danger{color:#f0524a;}
.menu .mi .m-ic{display:flex;color:inherit;}

/* 重命名行内输入 */
.rename-input{width:100%;border:1px solid var(--blue);border-radius:7px;padding:2px 6px;font-size:13.5px;font-family:inherit;outline:none;}

.empty-hint{grid-column:1/-1;text-align:center;color:var(--sub2);font-size:13px;padding:34px 0;display:none;}

/* 新建项目弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;z-index:50;}
.mask.show{display:flex;}
.modal{width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;background:#fff;border-radius:18px;padding:26px 26px 22px;box-shadow:0 24px 60px rgba(15,23,42,.25);}
.modal h3{font-size:18px;font-weight:700;}
.modal .m-sub{font-size:12.5px;color:var(--sub);margin-top:5px;}
.fld{margin-top:18px;}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:7px;}
.fld input[type=text],.fld textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;color:var(--text);background:#fff;}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);}
.fld textarea{resize:none;height:68px;}
.m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;}
.btn{height:38px;padding:0 20px;border-radius:10px;font-size:13.5px;cursor:pointer;border:1px solid var(--border);background:#fff;color:#3a3f47;font-family:inherit;}
.btn:hover{background:#f5f6f8;}
.btn-pri{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn-pri:hover{background:#000;}

/* 企业项目：节点配置 */
.node-section{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;}
.node-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line);cursor:pointer;}
.node-head .nh-ic{width:22px;height:22px;border-radius:6px;background:#f0ecfa;color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.node-head .nh-t{font-size:13px;font-weight:600;flex:1;}
.node-head .nh-del{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#c2c7cf;cursor:pointer;}
.node-head .nh-del:hover{color:#f0524a;background:#fdeceb;}
.node-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;}
.task-mini{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #f0f1f4;border-radius:9px;background:#fff;}
.task-mini .tm-input{flex:1;border:none;outline:none;font-size:13px;font-family:inherit;background:transparent;color:var(--text);}
.task-mini .tm-input::placeholder{color:#b4b9c1;}
.assignee-select{display:flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--border);border-radius:7px;padding:0 8px;height:28px;cursor:pointer;flex-shrink:0;color:var(--sub);white-space:nowrap;}
.assignee-select:hover{border-color:var(--blue);color:var(--blue);}
.assignee-select .as-av{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:#fff;}
.assignee-select .as-av.ai{background:linear-gradient(135deg,#2b6de8,#4d8dff);}
.assignee-select .as-av.bot{background:linear-gradient(135deg,#6a5be2,#8b7af0);}
.task-mini .tm-del{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#c2c7cf;cursor:pointer;flex-shrink:0;}
.task-mini .tm-del:hover{color:#f0524a;}
.node-add-task{font-size:12px;color:var(--blue);cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:4px 0;}
.node-add-task:hover{text-decoration:underline;}
.btn-add-node{margin-top:12px;width:100%;height:36px;border:1px dashed #d3d8e0;border-radius:10px;background:#fff;font-size:13px;color:var(--sub);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
.btn-add-node:hover{border-color:var(--blue);color:var(--blue);background:#fafcff;}

/* toast */
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:rgba(31,35,41,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:3px;}
</style>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="tb-tools">
      <a class="tb-icon" href="index.html" title="搜索"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg></a>
      <a class="tb-icon" href="index.html" title="侧边栏"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M9 4v16"/></svg></a>
    </div>
  </div>

  <div class="body">
    <aside class="side">
      <nav class="nav">
        <a class="nav-item new" href="index.html"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>新建任务</a>
        <a class="nav-item" href="history.html"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M21 11.5a8 8 0 0 1-11.5 7.2L4 20l1.3-5.4A8 8 0 1 1 21 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-linecap="round"/></svg></span>任务记录</a>
        <div class="nav-item" onclick="toast('定时任务（原型演示）')"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.6 2M9 2h6M12 5V2"/></svg></span>定时任务</div>
        <a class="nav-item on" href="projects.html"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8.2 7.3 15.8 10.7M8.2 16.7l7.6-3.4"/></svg></span>项目</a>
        <a class="nav-item" href="employees.html"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 13.7 9.3 19.5 11 13.7 12.7 12 18.5 10.3 12.7 4.5 11 10.3 9.3Z"/><path d="M18.5 16.5 19 18l1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5Z" stroke-width="1.3"/></svg></span>硅基员工·技能·连接器</a>
        <div class="nav-item" onclick="toast('AI 资产库（原型演示）')"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.2-1.4 4.4-2 8-2s5.8.6 8 2v13c-2.2-1.4-4.4-2-8-2s-5.8.6-8 2Z"/><path d="M12 3.5v13"/></svg></span>AI资产库</div>
        <div class="nav-item" onclick="toast('更多（原型演示）')"><span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span>更多</div>
      </nav>
      <div class="im">
        <div class="rail">
          <div class="r-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5 3 7l5 5-5 5 2 2 7-7Z"/><path d="m12 5 7 7-7 7"/></svg></div>

<div class="toast" id="toastEl"></div>
<script>
let PROJECTS=[
  {id:'p1',name:'五一安徽旅游推荐',created:'2026-10-12',type:'simple'},
  {id:'p2',name:'Q4市场竞品分析',created:'2026-10-12',type:'enterprise'},
  {id:'p3',name:'新产品发布筹备',created:'2026-10-10',type:'enterprise'},
  {id:'p4',name:'个人阅读笔记',created:'2026-10-08',type:'simple'},
  {id:'p5',name:'客户尽调报告',created:'2026-10-05',type:'simple'},
  {id:'p6',name:'年度复盘总结',created:'2026-10-01',type:'simple'}
];

// 待办数据
let TODOS=[
  {id:1,text:'收集Q4竞品数据',proj:'Q4市场竞品分析',done:false,deadline:'10-15',assignee:{type:'ai',name:'龙虾'}},
  {id:2,text:'撰写竞品对比章节',proj:'Q4市场竞品分析',done:true,deadline:'10-12',assignee:{type:'ai',name:'龙虾'}},
  {id:3,text:'审核市场分析报告',proj:'Q4市场竞品分析',done:false,deadline:'10-16',assignee:{type:'bot',name:'分析员'}},
  {id:4,text:'设计发布活动主视觉',proj:'新产品发布筹备',done:false,deadline:'10-18',assignee:{type:'bot',name:'设计师'}},
  {id:5,text:'生成产品说明书PDF',proj:'新产品发布筹备',done:false,deadline:'10-14',assignee:{type:'ai',name:'龙虾'}},
  {id:6,text:'整理客户尽调材料',proj:'客户尽调报告',done:true,deadline:'10-06',assignee:{type:'ai',name:'龙虾'}},
  {id:7,text:'生成尽调结论摘要',proj:'客户尽调报告',done:false,deadline:'10-20',assignee:{type:'ai',name:'龙虾'}}
];

// 指派人选项
const ASSIGNEES=[
  {type:'ai',name:'龙虾',cls:'ai',label:'AI'},
  {type:'bot',name:'分析员',cls:'bot',label:'分'},
  {type:'bot',name:'设计师',cls:'bot',label:'设'},
  {type:'bot',name:'研究员',cls:'bot',label:'研'},
  {type:'bot',name:'审核员',cls:'bot',label:'审'}
];

// ===== 一级 Tab 切换 =====
function switchTopTab(el,tab){
  document.querySelectorAll('.top-tabs .tt').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pane-proj').style.display=tab==='proj'?'':'none';
  document.getElementById('pane-todo').classList.toggle('on',tab==='todo');
}
document.getElementById('projCount').textContent=PROJECTS.length;
document.getElementById('todoCount').textContent=TODOS.filter(t=>!t.done).length;

// ===== 创建按钮下拉菜单 =====
function toggleCreateMenu(e){
  e.stopPropagation();
  document.getElementById('createMenu').classList.toggle('show');
}
document.addEventListener('click',()=>document.getElementById('createMenu').classList.remove('show'));

// ===== 创建弹窗 =====
let createType='simple';
let createNodes=[]; // 企业项目节点配置

function openCreate(type){
  createType=type||'simple';
  document.getElementById('createMenu').classList.remove('show');
  document.getElementById('fName').value='';
  document.getElementById('fDesc').value='';
  if(createType==='enterprise'){
    document.getElementById('modalTitle').textContent='创建企业项目';
    document.getElementById('modalSub').textContent='配置流程节点，每个节点可指定任务并指派给龙虾或硅基员工';
    document.getElementById('nodeField').style.display='';
    createNodes=[{name:'',tasks:[{name:'',assignee:0}]}];
    renderNodes();
  }else{
    document.getElementById('modalTitle').textContent='创建项目';
    document.getElementById('modalSub').textContent='创建后将进入项目空间，可在项目内发起任务、管理资料与产出物';
    document.getElementById('nodeField').style.display='none';
  }
  document.getElementById('mask').classList.add('show');
  setTimeout(()=>document.getElementById('fName').focus(),50);
}
function closeCreate(){ document.getElementById('mask').classList.remove('show'); }

// 节点配置
function renderNodes(){
  const list=document.getElementById('nodeList');
  list.innerHTML=createNodes.map((n,ni)=>`
    <div class="node-section" data-ni="${ni}">
      <div class="node-head">
        <span class="nh-ic">${ni+1}</span>
        <input class="nh-t" placeholder="节点名称（如：调研、撰写、审核）" value="${esc(n.name)}" oninput="createNodes[${ni}].name=this.value" style="border:none;outline:none;background:transparent;font-size:13px;font-weight:600;font-family:inherit;">
        <div class="nh-del" onclick="delNode(${ni})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></div>
      </div>
      <div class="node-body">
        ${n.tasks.map((t,ti)=>`
          <div class="task-mini">
            <input class="tm-input" placeholder="任务名称…" value="${esc(t.name)}" oninput="createNodes[${ni}].tasks[${ti}].name=this.value">
            <div class="assignee-select" onclick="cycleAssignee(${ni},${ti})">
              <span class="as-av ${ASSIGNEES[t.assignee].cls}">${ASSIGNEES[t.assignee].label}</span>
              ${ASSIGNEES[t.assignee].name}
            </div>
            <div class="tm-del" onclick="delTask(${ni},${ti})"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
          </div>
        `).join('')}
        <span class="node-add-task" onclick="addTask(${ni})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          添加任务
        </span>
      </div>
    </div>
  `).join('');
}
function addNode(){ createNodes.push({name:'',tasks:[{name:'',assignee:0}]}); renderNodes(); }
function delNode(ni){ if(createNodes.length<=1){toast('至少保留一个节点');return;} createNodes.splice(ni,1); renderNodes(); }
function addTask(ni){ createNodes[ni].tasks.push({name:'',assignee:0}); renderNodes(); }
function delTask(ni,ti){ if(createNodes[ni].tasks.length<=1){toast('节点下至少保留一个任务');return;} createNodes[ni].tasks.splice(ti,1); renderNodes(); }
function cycleAssignee(ni,ti){
  createNodes[ni].tasks[ti].assignee=(createNodes[ni].tasks[ti].assignee+1)%ASSIGNEES.length;
  renderNodes();
}

function createProject(){
  const name=document.getElementById('fName').value.trim();
  if(!name){ toast('请输入项目名称'); document.getElementById('fName').focus(); return; }
  const d=new Date();
  const id='p'+Date.now();
  const created=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  // 企业项目：将节点配置编码到 URL
  let extra='';
  if(createType==='enterprise'){
    const nodes=createNodes.filter(n=>n.name.trim()||n.tasks.some(t=>t.name.trim()));
    if(nodes.length){ extra='&nodes='+encodeURIComponent(JSON.stringify(nodes.map(n=>({name:n.name||'节点',tasks:n.tasks.filter(t=>t.name.trim()).map(t=>({name:t.name,assignee:ASSIGNEES[t.assignee].name,type:ASSIGNEES[t.assignee].type}))})))); }
    extra+='&type=enterprise';
  }
  closeCreate();
  location.href='project-detail.html?id='+encodeURIComponent(id)+'&name='+encodeURIComponent(name)+'&fresh=1'+extra;
}

// ===== 项目卡片渲染 =====
function renderMine(){
  const kw=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  const list=PROJECTS.filter(p=>p.name.toLowerCase().includes(kw));
  const grid=document.getElementById('myGrid');
  grid.innerHTML = (list.length ? list.map(p=>`
    <div class="pcard" data-id="${p.id}" onclick="openProject('${p.id}')">
      <div class="p-row">
        <div class="p-ic ${p.type==='enterprise'?'enterprise':''}">
          ${p.type==='enterprise'
            ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8.2 7.3 15.8 10.7M8.2 16.7l7.6-3.4"/></svg>'
            : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></svg>'
          }
        </div>
        <div class="p-name" data-name>${p.name}</div>
        <div class="p-more" onclick="event.stopPropagation();toggleMenu(event,'${p.id}')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </div>
      </div>
      <div class="p-time">
        <span>创建时间：${p.created}</span>
        <span class="p-badge ${p.type}">${p.type==='enterprise'?'企业':'简单'}</span>
      </div>
    </div>`).join('') : '<div class="empty-hint" style="display:block">没有匹配的项目</div>')
    + `<div class="pcard-create" onclick="toggleCreateMenu(event)">
         <span class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
         创建项目
       </div>`;
}

/* 卡片菜单：重命名 / 删除 */
let menuId=null;
function toggleMenu(e,id){
  const menu=document.getElementById('cardMenu');
  const card=document.querySelector(`.pcard[data-id="${id}"]`);
  const r=card.getBoundingClientRect();
  menu.classList.add('show');
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  menu.style.left=Math.min(r.right-mw+8, window.innerWidth-mw-12)+'px';
  menu.style.top=Math.min(r.bottom+4, window.innerHeight-mh-12)+'px';
  menuId=id;
}
function closeMenu(){ document.getElementById('cardMenu').classList.remove('show'); menuId=null; }
document.addEventListener('click',e=>{
  if(!e.target.closest('#cardMenu') && !e.target.closest('.p-more')) closeMenu();
});
function onRename(){
  const p=PROJECTS.find(x=>x.id===menuId); if(!p) return;
  const card=document.querySelector(`.pcard[data-id="${menuId}"]`);
  const nameEl=card.querySelector('[data-name]');
  if(card.querySelector('.rename-input')) return;
  const old=p.name;
  nameEl.innerHTML=`<input class="rename-input" value="${old.replace(/"/g,'&quot;')}">`;
  const input=nameEl.querySelector('input');
  input.focus(); input.select();
  let done=false;
  const commit=()=>{
    if(done) return; done=true;
    const v=input.value.trim();
    if(v && v!==old){ p.name=v; toast('已重命名'); }
    renderMine();
  };
  input.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();commit();}
    if(ev.key==='Escape'){done=true;renderMine();}
  });
  input.addEventListener('blur',()=>setTimeout(commit,120));
  closeMenu();
}
function onDelete(){
  const p=PROJECTS.find(x=>x.id===menuId); if(!p) return;
  PROJECTS=PROJECTS.filter(x=>x.id!==menuId);
  renderMine(); closeMenu(); toast('已删除项目「'+p.name+'」');
}

function openProject(id){
  const p=PROJECTS.find(x=>x.id===id);
  const t=p&&p.type==='enterprise'?'&type=enterprise':'';
  location.href='project-detail.html?id='+encodeURIComponent(id)+'&name='+encodeURIComponent(p?p.name:'项目')+t;
}

// ===== 待办列表 =====
function renderTodo(){
  const done=TODOS.filter(t=>t.done).length;
  const pending=TODOS.filter(t=>!t.done && !t.deadline.endsWith('-00')).length;
  const over=TODOS.filter(t=>!t.done && parseInt(t.deadline.split('-')[1])<15).length;
  document.getElementById('todoStats').innerHTML=`
    <div class="todo-stat"><div class="ts-n pending">${TODOS.length-done}</div><div class="ts-l">待处理</div></div>
    <div class="todo-stat"><div class="ts-n done">${done}</div><div class="ts-l">已完成</div></div>
    <div class="todo-stat"><div class="ts-n over">${over}</div><div class="ts-l">即将逾期</div></div>
  `;
  // 按项目分组
  const groups={};
  TODOS.forEach(t=>{ (groups[t.proj]=groups[t.proj]||[]).push(t); });
  document.getElementById('todoList').innerHTML=Object.entries(groups).map(([proj,items])=>`
    <div class="todo-group-h">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></svg>
      ${proj}
    </div>
    ${items.map(t=>`
      <div class="todo-item ${t.done?'done':''}">
        <div class="todo-ck ${t.done?'done':''}" onclick="toggleTodo(${t.id})">
          ${t.done?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"/></svg>':''}
        </div>
        <div class="todo-body">
          <div class="todo-text">${t.text}</div>
          <div class="todo-meta">
            <span class="tm-proj">${t.proj}</span>
            <span>截止 ${t.deadline}</span>
          </div>
        </div>
        <div class="todo-assignee">
          <span class="a-av ${t.assignee.type==='ai'?'ai':'bot'}">${t.assignee.type==='ai'?'AI':t.assignee.name.charAt(0)}</span>
          ${t.assignee.name}
        </div>
      </div>
    `).join('')}
  `).join('');
}
function toggleTodo(id){
  const t=TODOS.find(x=>x.id===id);
  if(t){ t.done=!t.done; document.getElementById('todoCount').textContent=TODOS.filter(x=>!x.done).length; renderTodo(); }
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* 会话列表 */
document.getElementById('convList').innerHTML=Array.from({length:6},()=>`
  <div class="conv-item" onclick="toast('打开会话（原型演示）')">
    <img class="face" src="assets/avatar.png">
    <div class="meta"><div class="row1"><span class="nm">梁梦欣</span><span class="time">12:00</span></div><div class="preview">[5条]发给你了噢~</div></div>
  </div>`).join('');

let toastTimer;
function toast(msg){const el=document.getElementById('toastEl');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCreate();});
renderMine();
renderTodo();
</script>
